[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
# internal (layering: docs/architecture.md, enforced by `cargo xtask layers`)
tenon-geom = { path = "crates/geom" }
tenon-dxf = { path = "crates/dxf" }
tenon-kernel = { path = "crates/kernel" }
tenon-kernel-occt = { path = "crates/kernel-occt" }
tenon-sketch = { path = "crates/sketch" }
tenon-model = { path = "crates/model" }
tenon-assembly = { path = "crates/assembly" }
tenon-drawing = { path = "crates/drawing" }
tenon-io = { path = "crates/io" }
tenon-render = { path = "crates/render" }
tenon-ui = { path = "crates/ui" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
robust = "1.2"

# native bindings (kernel-occt only; enforced by `cargo xtask layers`)
cxx = "1.0.202"
cxx-build = "1.0.202"

# ui (ui and app only)
egui = "0.36"
eframe = { version = "0.36", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Never crash: production code returns errors instead (clippy.toml relaxes these in tests).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
dbg_macro = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

# Windows Smart App Control (when enabled) judges each freshly built DLL/EXE by reputation and may
# refuse to load one, e.g. a proc-macro, which rustc then reports as "can't find crate". Changing a
# package's codegen settings gives the file a new hash and a new verdict. See docs/setup.md.
[profile.dev.package.zerocopy-derive]
opt-level = 1

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
