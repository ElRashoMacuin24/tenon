[package]
name = "tenon-cli"
description = "Headless Tenon: command scripts, MCP server, rendering, inspection, conversion"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "tenon_cli"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "tenon-cli"
path = "src/main.rs"
test = false

[dependencies]
tenon-geom = { workspace = true }
tenon-kernel = { workspace = true }
tenon-kernel-occt = { workspace = true }
tenon-sketch = { workspace = true }
tenon-model = { workspace = true }
tenon-assembly = { workspace = true }
tenon-drawing = { workspace = true }
tenon-io = { workspace = true }
tenon-render = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tenon-dxf = { workspace = true }
