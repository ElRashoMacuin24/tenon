# Release archives (DEC-101): by hand (Actions > Release > Run workflow), and on a version tag.
#
# Each platform's archive is made by `cargo xtask dist`, which also runs the packaged programs
# with nothing of the build environment on their search paths. A tag `v*` puts the archives in
# a draft release, with the changelog's section for that version as its notes; the draft is
# published by hand.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux is built on the older runner, so that the archive runs on older systems too.
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages for the windowing stack
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable

      # Installed afresh, not from a cache: the licence texts that go into the archive are read
      # from the package cache that the installation fills.
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.81.0
          cache: false
          environments: default

      - uses: Swatinem/rust-cache@v2

      - name: Package and try it
        run: pixi run cargo xtask dist

      - uses: actions/upload-artifact@v4
        with:
          name: tenon-${{ runner.os }}
          path: |
            target/dist/*.zip
            target/dist/*.tar.gz
          if-no-files-found: error

  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The changelog's section for this version: from its heading to the next.
          awk -v v="$version" '/^## / { on = index($0, "## " v) == 1; next } on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/* --draft --title "Tenon $version" --notes-file notes.md
