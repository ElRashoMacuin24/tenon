# Diagnostic branch only: the corner seam test on macOS, with its steps printed.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: diag (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
    runs-on: ${{ matrix.os }}
    env:
      TENON_SEAM_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.81.0
          cache: true

      - uses: Swatinem/rust-cache@v2

      - name: Corner seam, step by step
        run: pixi run cargo test -p tenon-model --test sheet_metal a_corner_seam -- --nocapture
